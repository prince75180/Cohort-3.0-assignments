<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Dashboard</title>
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
    <!-- Dynamic Background Layer -->
    <div class="background-layer" id="bg-layer"></div>

    <main class="app-container">
        
        <!-- Dashboard View -->
        <section id="dashboard" class="view active">
            <header class="dashboard-header">
                <div class="date-time-widget">
                    <h1 id="time-display">--:--</h1>
                    <p id="date-display">-- --- ----</p>
                </div>
                <div class="top-controls">
                    <div class="weather-widget" id="weather-widget">
                        <span class="material-symbols-outlined" id="weather-icon">cloud</span>
                        <span id="weather-temp">--°C</span>
                    </div>
                    <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                        <span class="material-symbols-outlined">light_mode</span>
                    </button>
                </div>
            </header>

            <div class="dashboard-grid">
                <!-- Todo Card -->
                <button class="feature-card" data-target="todo-view">
                    <span class="material-symbols-outlined card-icon">checklist</span>
                    <h3>Todo List</h3>
                </button>
                <!-- Planner Card -->
                <button class="feature-card" data-target="planner-view">
                    <span class="material-symbols-outlined card-icon">event_note</span>
                    <h3>Daily Planner</h3>
                </button>
                <!-- Goals Card -->
                <button class="feature-card" data-target="goals-view">
                    <span class="material-symbols-outlined card-icon">target</span>
                    <h3>Daily Goals</h3>
                </button>
                <!-- Pomodoro Card -->
                <button class="feature-card" data-target="pomodoro-view">
                    <span class="material-symbols-outlined card-icon">timer</span>
                    <h3>Pomodoro Timer</h3>
                </button>
                <!-- Motivation Card -->
                <button class="feature-card" data-target="motivation-view">
                    <span class="material-symbols-outlined card-icon">format_quote</span>
                    <h3>Motivation</h3>
                </button>
            </div>
        </section>

        <!-- Feature Views Container -->
        <div id="feature-views">
            
            <!-- Todo View -->
            <section id="todo-view" class="view">
                <header class="feature-header">
                    <button class="back-btn icon-btn"><span class="material-symbols-outlined">arrow_back</span></button>
                    <h2>Todo List</h2>
                </header>
                <div class="feature-content">
                    <form id="todo-form">
                        <input type="text" id="todo-input" placeholder="Add a new task..." required>
                        <button type="submit" class="primary-btn">Add</button>
                    </form>
                    <ul id="todo-list" class="task-list"></ul>
                </div>
            </section>

            <!-- Planner View -->
            <section id="planner-view" class="view">
                <header class="feature-header">
                    <button class="back-btn icon-btn"><span class="material-symbols-outlined">arrow_back</span></button>
                    <h2>Daily Planner</h2>
                </header>
                <div class="feature-content planner-container" id="planner-slots">
                    <!-- Hourly slots generated by JS -->
                </div>
            </section>

            <!-- Goals View -->
            <section id="goals-view" class="view">
                <header class="feature-header">
                    <button class="back-btn icon-btn"><span class="material-symbols-outlined">arrow_back</span></button>
                    <h2>Daily Goals</h2>
                </header>
                <div class="feature-content">
                    <div class="progress-container">
                        <p id="goals-progress-text">0 of 0 completed</p>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="goals-progress-fill"></div>
                        </div>
                    </div>
                    <form id="goals-form">
                        <input type="text" id="goal-input" placeholder="What's a main goal today?" required>
                        <button type="submit" class="primary-btn">Add</button>
                    </form>
                    <ul id="goals-list" class="task-list"></ul>
                </div>
            </section>

            <!-- Pomodoro View -->
            <section id="pomodoro-view" class="view">
                <header class="feature-header">
                    <button class="back-btn icon-btn"><span class="material-symbols-outlined">arrow_back</span></button>
                    <h2>Pomodoro Timer</h2>
                </header>
                <div class="feature-content pomodoro-container">
                    <h3 id="pomodoro-mode">Work Session</h3>
                    <div class="timer-display" id="timer-display">25:00</div>
                    <div class="timer-controls">
                        <button id="pomo-start" class="primary-btn">Start</button>
                        <button id="pomo-pause" class="secondary-btn">Pause</button>
                        <button id="pomo-reset" class="secondary-btn">Reset</button>
                    </div>
                </div>
            </section>

            <!-- Motivation View -->
            <section id="motivation-view" class="view">
                <header class="feature-header">
                    <button class="back-btn icon-btn"><span class="material-symbols-outlined">arrow_back</span></button>
                    <h2>Motivation</h2>
                </header>
                <div class="feature-content motivation-container">
                    <blockquote id="quote-text">Loading inspiration...</blockquote>
                    <cite id="quote-author"></cite>
                    <button id="new-quote-btn" class="primary-btn">New Quote</button>
                </div>
            </section>

        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
